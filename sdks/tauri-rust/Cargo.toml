[package]
name = "olaiedge-tauri"
version = "1.0.0"
edition = "2021"
description = "OlaiEdge Agent Engine integration crate for Tauri desktop applications"
license = "MIT"
authors = ["Siddardha Shayini"]

[dependencies]
tauri = { version = "1.6", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "stream"] }
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
thiserror = "1.0"
