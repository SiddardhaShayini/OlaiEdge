<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="512" height="512" role="img" aria-label="OlaiEdge logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- tile -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- "O" ring with an opening at the edge (signal exit) -->
  <circle cx="128" cy="128" r="78" fill="none" stroke="url(#ring)" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="400 90" transform="rotate(33 128 128)"/>
  <!-- "E" built from circuit traces -->
  <g stroke="#F8FAFC" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M100 96V160"/>
    <path d="M100 96H138"/>
    <path d="M100 160H138"/>
  </g>
  <path d="M100 128H198" stroke="url(#ring)" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- nodes -->
  <circle cx="148" cy="96" r="6" fill="#22D3EE"/>
  <circle cx="148" cy="160" r="6" fill="#8B5CF6"/>
  <circle cx="208" cy="128" r="22" fill="url(#glow)"/>
  <circle cx="208" cy="128" r="9" fill="#22D3EE"/>
  <circle cx="208" cy="128" r="3.5" fill="#0B1020"/>
</svg>
