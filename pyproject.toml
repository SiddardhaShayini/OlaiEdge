[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "olaiedge"
version = "1.0.0"
description = "OlaiEdge: Embeddable Edge Agent Engine for Desktop Apps (Electron, Tauri, Flutter). Successor to FastAgent."
readme = "README.md"
authors = [{ name = "Siddardha Shayini" }]
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "psutil>=5.9.0"
]

[project.scripts]
olai = "olaiedge.cli:main"
olaiedge = "olaiedge.cli:main"
fastagent-edge = "olaiedge.cli:main"

[project.optional-dependencies]
wizard = ["streamlit>=1.20.0"]
tools = ["duckduckgo-search>=6.0.0"]
dev = ["pytest>=7.0.0"]
all = ["streamlit>=1.20.0", "duckduckgo-search>=6.0.0", "pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["olaiedge*", "fast_agent*"]

[tool.setuptools.package-data]
olaiedge = ["_engine/*"]
